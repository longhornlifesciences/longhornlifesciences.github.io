# Site settings. Restart `bundle exec jekyll serve` after editing this file.

title: Longhorn Life Sciences, Inc.
tagline: Improving patient outcomes and experiences through remote wound monitoring
description: >-
  Longhorn Life Sciences is a MedTech venture developing needs-driven medical
  technology to improve patient outcomes and experiences.
url: https://longhornlifesciences.com
baseurl: ""
lang: en-US

email: miles@longhornlifesciences.com # contact form submissions also go here via Formspree
formspree_form_path: f/xeqngvel

logo: /assets/img/brand/icon-192.png
social:
  name: Longhorn Life Sciences
  links:
    - https://www.linkedin.com/company/longhorn-life-sciences

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/brand/og-image.jpg

markdown: kramdown
sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
