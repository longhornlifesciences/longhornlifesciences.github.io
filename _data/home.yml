# Home page copy. Each top-level key feeds one section include in
# _includes/sections/. Plain strings; `desc`/`text` fields accept Markdown.
# A person's `credential` may be a string or a list (one line per item).

hero:
  eyebrow: "MedTech · Founded 2021"
  title: "Improving patient outcomes and experiences through remote wound monitoring."
  text: "A MedTech venture led by scientists, clinicians, and entrepreneurs."
  primary: { label: "Get in touch", section: contact }
  secondary: { label: "Our story", section: story }

mission:
  eyebrow: "Our mission"
  title: "To develop needs-driven medical technology that improves patient outcomes and experiences."
  text: >-
    Longhorn Life Sciences, Inc. (LLS) is a MedTech venture led by a strong and
    diverse team of scientists, clinicians, and entrepreneurs out of UT Austin and
    MD Anderson.

story:
  eyebrow: "Our story"
  title: "From a Texas Biodesign team to a MedTech company."
  # Events render in list order. `fit: contain` suits logos (no cropping).
  # `image` is a path stem: the site loads <stem>-480.webp and <stem>-720.webp.
  # `focus` sets the crop point as a CSS object-position (e.g. "85% center"
  # keeps the right side).
  events:
    - date: "Spring 2021"
      title: "Our humble beginnings"
      desc: "Our team came together as part of the inaugural Texas Biodesign program, which teaches a needs-based approach to innovation in the medical sector. The team identified several quality needs, eventually leading to the concept that became iDetect."
      image: assets/img/story/utcampus
      alt: "The UT Austin campus and tower at sunset"
    - date: "Spring 2021 – Fall 2021"
      title: "VentureWell E-Team"
      desc: "We were selected as an E-Team in the VentureWell program at the Pioneer and Propel levels. Its workshops gave us coaching, mentorship, and a series of customer discovery interviews that sharpened our value propositions and market strategy."
      image: assets/img/story/venturewell
      alt: "VentureWell logo"
      fit: contain
    - date: "July 2021"
      title: "Longhorn Life Sciences is founded"
      desc: "After completing Texas Biodesign, the team began developing iDetect and incorporated Longhorn Life Sciences as a Delaware C Corp."
      image: assets/img/story/llsteam
      alt: "The founding Longhorn Life Sciences team"
    - date: "2021 – Present"
      title: "Engaging strategic partners"
      desc: "We have sought out strategic partnerships, including established wound care device manufacturers, the Department of Defense, and NASA's Office of Technology Transfer."
      image: assets/img/story/strategicpartnerships
      alt: "The team with partners at an event"
    - date: "Fall 2021 – Present"
      title: "Pitch competitions"
      desc: "We have competed in the Texas Venture Labs Investment Competition on four occasions, winning it in Fall 2024 along with several additional awards, including the award for top health innovation. We were an alternate for the Texas A&M New Ventures Competition, where we won the elevator pitch and two other awards, and were invited to pitch at Project Medtech in 2024."
      image: assets/img/story/pitch
      focus: "85% center"
      alt: "A team member pitching on stage"
    - date: "Spring 2022 – Present"
      title: "Customer discovery"
      desc: "Led by Dr. Miles Massidda, Dr. Cristina Checka, and students in the Texas Venture Labs Practicum, the team has completed 140 customer discovery interviews, in part through the VentureWell and Washington University Equalize mentorship programs. The interviews have targeted doctors, nurses, patients, and clinical purchasing teams to validate the clinical need, mitigate regulatory hurdles, and identify viable sales channels."
      image: assets/img/story/customerdiscovery
      alt: "Team members conducting interviews"
    - date: "Fall 2025 – Winter 2026"
      title: "gBETA accelerator"
      desc: "We were selected for gBETA Round Rock, a gener8tor accelerator program hosted with the Round Rock Chamber, providing mentorship and investor introductions."
    - date: "August 2026"
      title: "American Cancer Society accelerator grant"
      desc: "We were awarded an accelerator grant from the American Cancer Society to support the development of iDetect."

