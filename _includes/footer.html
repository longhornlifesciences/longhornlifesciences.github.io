<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <img src="{{ '/assets/img/brand/medallion-128.webp' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" width="32" height="32">
      <span>{{ site.title }}</span>
    </div>
    <div class="site-footer__signup">
      <span class="site-footer__label">{{ site.data.newsletter.footer.label }}</span>
      {% include newsletter-form.html id="nl-footer" location="footer" button=site.data.newsletter.footer.button class="nl-form--dark" button_class="btn--teal" %}
    </div>
    <ul class="site-footer__links">
      <li>&copy; {{ 'now' | date: "%Y" }}</li>
      <li><a href="{{ '/legal' | relative_url }}">Privacy policy</a></li>
      <li><a href="{{ site.data.home.contact.linkedin.url }}" rel="noopener" target="_blank">LinkedIn<span class="visually-hidden"> (opens in a new tab)</span></a></li>
    </ul>
  </div>
</footer>
