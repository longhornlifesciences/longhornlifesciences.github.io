<section class="page-section text-center" id="{{ site.data.sitetext[site.locale].linkedin.section }}">
  <div class="container">
    <h2 class="section-heading text-uppercase">{{ site.data.sitetext[site.locale].linkedin.title }}</h2>
    <h3 class="section-subheading text-muted">{{ site.data.sitetext[site.locale].linkedin.text }}</h3>
    <a href="{{ site.data.sitetext[site.locale].linkedin.button_url }}"
       class="btn btn-primary btn-xl text-uppercase"
       target="_blank" rel="noopener noreferrer">
      <i class="fab fa-linkedin-in mr-2"></i> {{ site.data.sitetext[site.locale].linkedin.button_text }}
    </a>
  </div>
</section>
