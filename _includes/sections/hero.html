{%- assign s = site.data.home.hero -%}
<section class="hero" id="top">
  <div class="container hero__inner">
    <div class="hero__copy">
      <p class="eyebrow eyebrow--on-dark">{{ s.eyebrow }}</p>
      <h1 class="hero__title">{{ s.title }}</h1>
      <p class="hero__text">{{ s.text }}</p>
      <div class="hero__actions">
        <a class="btn btn--teal" href="#{{ s.primary.section }}">{{ s.primary.label }}</a>
        <a class="link-arrow link-arrow--on-dark" href="#{{ s.secondary.section }}">{{ s.secondary.label }}</a>
      </div>
    </div>
    <div class="hero__mark">
      <img src="{{ '/assets/img/brand/medallion-640.webp' | relative_url }}?v={{ site.time | date: '%s' }}"
           srcset="{{ '/assets/img/brand/medallion-320.webp' | relative_url }}?v={{ site.time | date: '%s' }} 320w, {{ '/assets/img/brand/medallion-640.webp' | relative_url }}?v={{ site.time | date: '%s' }} 640w"
           sizes="(max-width: 959px) 260px, 440px" width="640" height="640" fetchpriority="high"
           alt="Longhorn Life Sciences medallion">
    </div>
  </div>
</section>
