---
layout: default
---
<article class="section page">
  <div class="container container--narrow">
    <header class="page__header">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1 class="page__title">{{ page.title }}</h1>
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
